    - { id: scientific-investigation, titleBn: 'বৈজ্ঞানিক অনুসন্ধান', titleEn: 'Scientific investigation' }
    - { id: lab-safety, titleBn: 'ল্যাবরেটরি নিরাপত্তা ও বিপদ সংকেত', titleEn: 'Laboratory safety and hazard symbols' }
  outcomes:
    - 'রসায়ন কী এবং দৈনন্দিন জীবনে এর ভূমিকা ব্যাখ্যা করতে পারবে।'
    - 'পদার্থবিজ্ঞান, জীববিজ্ঞান, কৃষি ও চিকিৎসার সাথে রসায়নের সম্পর্ক উদাহরণ দিয়ে বলতে পারবে।'
    - 'প্রশ্ন → অনুমান → পরীক্ষা → পর্যবেক্ষণ → সিদ্ধান্ত, এই ধাপে একটি সহজ অনুসন্ধান পরিকল্পনা করতে পারবে।'
    - 'বিপদ সংকেত দেখে রাসায়নিক দ্রব্যের ঝুঁকি চিনতে ও নিরাপদে ব্যবহার করতে পারবে।'

