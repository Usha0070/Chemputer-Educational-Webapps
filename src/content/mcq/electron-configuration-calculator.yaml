# MCQ practice for the simulation "electron-configuration-calculator": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'K (পারমাণবিক সংখ্যা ১৯)-এর ইলেকট্রন বিন্যাস কোনটি?'
    options: ['1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹', '1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹', '1s² 2s² 2p⁶ 3s² 3p⁷', '1s² 2s² 2p⁶ 3s² 3p⁵ 4s²']
    answer: 0
    why: '3p পূর্ণ হওয়ার পর 4s-এর শক্তি 3d-এর চেয়ে কম, তাই ১৯তম ইলেকট্রন 4s-এ যায়। p উপস্তরে ৭টি ইলেকট্রন থাকতে পারে না।'
  - q: 'S (পারমাণবিক সংখ্যা ১৬) পর্যায় সারণির কোথায় অবস্থিত?'
    options: ['পর্যায় ৩, গ্রুপ ১৬', 'পর্যায় ২, গ্রুপ ১৬', 'পর্যায় ৩, গ্রুপ ৬', 'পর্যায় ৪, গ্রুপ ১৬']
    answer: 0
    why: 'S: 1s² 2s² 2p⁶ 3s² 3p⁴। সর্বোচ্চ শক্তিস্তর ৩ (পর্যায় ৩); p-ব্লক বলে গ্রুপ = ১০ + ২ + ৪ = ১৬।'
  - q: 'একটি মৌলের ইলেকট্রন বিন্যাস [Ne] 3s² 3p¹। মৌলটি কোন ব্লকের?'
    options: ['p-ব্লক', 's-ব্লক', 'd-ব্লক', 'f-ব্লক']
    answer: 0
    why: 'শেষ ইলেকট্রন 3p-তে প্রবেশ করেছে, তাই p-ব্লক। মৌলটি অ্যালুমিনিয়াম।'
  - q: 'Ca (পারমাণবিক সংখ্যা ২০) সম্পর্কে—'
    statements:
      - 'এর শেষ ইলেকট্রন 4s অরবিটালে প্রবেশ করে'
      - 'এটি s-ব্লকের মৌল'
      - 'এটি পর্যায় ৩-এ অবস্থিত'
    answer: 0
    why: 'Ca: [Ar] 4s²। সর্বোচ্চ শক্তিস্তর ৪, তাই এটি পর্যায় ৪-এ। iii ভুল।'
  - stem: 'X মৌলের পারমাণবিক সংখ্যা ১৭।'
    q: 'X-এর যোজ্যতা স্তরে কয়টি ইলেকট্রন আছে?'
    options: ['৭', '৫', '১৭', '১']
    answer: 0
    why: 'X: 2, 8, 7 (1s² 2s² 2p⁶ 3s² 3p⁵)। শেষ স্তরে 3s² 3p⁵ = ৭টি ইলেকট্রন; মৌলটি ক্লোরিন।'
