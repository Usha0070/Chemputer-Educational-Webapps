# MCQ practice for the simulation "soap": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'চর্বি বা তেলের সাথে NaOH-এর বিক্রিয়ায় সাবান তৈরিকে কী বলে?'
    options: ['সাবানীকরণ', 'এস্টারীকরণ', 'পলিমারকরণ', 'প্রশমন']
    answer: 0
    why: 'ক্ষারের প্রভাবে চর্বির এস্টার বন্ধন ভেঙে ফ্যাটি এসিডের সোডিয়াম লবণ (সাবান) ও গ্লিসারল তৈরি হয়; একে সাবানীকরণ বলে।'
  - q: 'সাবানীকরণে সাবানের সাথে আর কোনটি উৎপন্ন হয়?'
    options: ['গ্লিসারল', 'ইথানল', 'পানি', 'কার্বন ডাইঅক্সাইড']
    answer: 0
    why: 'চর্বি (গ্লিসারাইল ট্রাইস্টিয়ারেট) + 3NaOH → গ্লিসারল + 3 সোডিয়াম স্টিয়ারেট।'
  - q: 'সাবানের অণুর কোন অংশ তেল-ময়লার ভেতরে ঢুকে যায়?'
    options: ['লম্বা হাইড্রোকার্বন লেজ', '–COO⁻ মাথা', 'Na⁺ আয়ন', 'পানির অণু']
    answer: 0
    why: 'হাইড্রোকার্বন লেজ পানি-বিদ্বেষী কিন্তু তেলপ্রেমী, তাই তেলে ঢোকে; আয়নিক মাথা থাকে বাইরে পানির দিকে।'
  - q: 'খর পানিতে সাবান ব্যবহার করলে—'
    statements:
      - 'ফেনা কম হয়'
      - 'Ca²⁺ ও Mg²⁺ আয়ন সাবানের সাথে অদ্রবণীয় স্কাম তৈরি করে'
      - 'সাবানের অপচয় হয়'
    answer: 3
    why: 'Ca²⁺ ও Mg²⁺ সাবান অণুর সাথে যুক্ত হয়ে স্কাম হয়; যতক্ষণ এই আয়ন থাকে ততক্ষণ সাবান নষ্ট হয় আর ফেনা হয় না। তিনটিই সঠিক।'
  - stem: 'একটি গ্রামের নলকূপের পানিতে কাপড় কাচতে অনেক সাবান লাগে আর বালতির গায়ে সাদা গাদ জমে। একই পানিতে ডিটারজেন্ট দিলে সহজেই ফেনা হয়।'
    q: 'ডিটারজেন্টে সহজে ফেনা হওয়ার কারণ কী?'
    options: ['ডিটারজেন্ট Ca²⁺ ও Mg²⁺-এর সাথে অদ্রবণীয় স্কাম তৈরি করে না', 'ডিটারজেন্ট পানির খরতা বাড়িয়ে দেয়', 'ডিটারজেন্টে কোনো তেলপ্রেমী অংশ নেই', 'ডিটারজেন্ট পানিতে অদ্রবণীয়']
    answer: 0
    why: 'ডিটারজেন্টের ক্যালসিয়াম ও ম্যাগনেসিয়াম লবণ পানিতে দ্রবণীয়, তাই খর পানিতেও স্কাম না হয়ে ফেনা হয়।'
