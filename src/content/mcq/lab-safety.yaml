# MCQ practice for the simulation "lab-safety": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'গাঢ় সালফিউরিক এসিডের বোতলে কোন বিপদ সংকেত থাকে?'
    options: ['ক্ষয়কারী', 'দাহ্য', 'চাপযুক্ত গ্যাস', 'বিস্ফোরক']
    answer: 0
    why: 'গাঢ় H₂SO₄ চামড়া পুড়িয়ে দেয় ও ধাতু ক্ষয় করে, তাই এর গায়ে ক্ষয়কারী সংকেত থাকে।'
  - q: 'এসিড পাতলা করার সঠিক নিয়ম কোনটি?'
    options: ['পানিতে এসিড ধীরে ধীরে ঢালা', 'এসিডে পানি দ্রুত ঢালা', 'এসিড ও পানি একসাথে ফোটানো', 'এসিডে বরফ ফেলে দেওয়া']
    answer: 0
    why: 'এসিডে পানি ঢাললে অল্প পানিতে প্রচণ্ড তাপ তৈরি হয়ে এসিড ছিটকে আসে; পানিতে এসিড ঢাললে তাপ ছড়িয়ে যায়।'
  - q: 'বৃত্তের ওপর আগুনের শিখা আঁকা সংকেতটি কী নির্দেশ করে?'
    options: ['জারক পদার্থ', 'দাহ্য পদার্থ', 'বিষাক্ত পদার্থ', 'বিস্ফোরক পদার্থ']
    answer: 0
    why: 'জারক নিজে না জ্বললেও অক্সিজেন জুগিয়ে অন্যের আগুন বাড়ায়; শুধু শিখা (বৃত্ত ছাড়া) হলো দাহ্য পদার্থের সংকেত।'
  - q: 'পারদের বোতলে যেসব সংকেত থাকতে পারে—'
    statements:
      - 'বিষাক্ত'
      - 'পরিবেশের জন্য ক্ষতিকর'
      - 'দীর্ঘমেয়াদি স্বাস্থ্যঝুঁকি'
    answer: 3
    why: 'পারদের বাষ্প অত্যন্ত বিষাক্ত, দীর্ঘদিনে স্নায়ুর ক্ষতি করে এবং পানিতে গিয়ে জীবের ক্ষতি করে; তিনটিই সঠিক।'
  - stem: 'ব্যবহারিক ক্লাসে তানিম টেস্টটিউবে তরল গরম করছিল। টিউবের মুখ ছিল তার পাশের বন্ধুর দিকে, আর টেবিলে স্পিরিটের খোলা বোতল রাখা ছিল।'
    q: 'তানিমের কোন কাজটি নিরাপদ ছিল না?'
    options: ['টেস্টটিউবের মুখ অন্যের দিকে রাখা এবং আগুনের কাছে খোলা স্পিরিট রাখা', 'টেস্টটিউব গরম করা', 'ব্যবহারিক ক্লাসে কাজ করা', 'স্পিরিট ল্যাম্প ব্যবহার করা']
    answer: 0
    why: 'হঠাৎ ফুটে উঠে গরম তরল কারও মুখে ছিটকে আসতে পারে, আর স্পিরিট দাহ্য বলে খোলা বোতল আগুন থেকে দূরে, মুখ বন্ধ করে রাখতে হয়।'
