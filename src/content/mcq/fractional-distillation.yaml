# MCQ practice for the simulation "fractional-distillation": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'পেট্রোলিয়ামের আংশিক পাতন কোন ধর্মের পার্থক্যের ওপর ভিত্তি করে হয়?'
    options: ['স্ফুটনাঙ্ক', 'ঘনত্ব', 'রং', 'পানিতে দ্রাব্যতা']
    answer: 0
    why: 'বিভিন্ন অংশের স্ফুটনাঙ্ক বিভিন্ন, তাই স্তম্ভের বিভিন্ন উচ্চতায় (ভিন্ন তাপমাত্রায়) তারা তরল হয়ে আলাদা হয়।'
  - q: 'আংশিক পাতন স্তম্ভের সবচেয়ে ওপর থেকে কোন অংশ পাওয়া যায়?'
    options: ['পেট্রোলিয়াম গ্যাস (LPG)', 'বিটুমিন', 'ডিজেল', 'লুব্রিকেটিং তেল']
    answer: 0
    why: 'সবচেয়ে ছোট অণু (C₁–C₄) সবচেয়ে কম তাপমাত্রায় ফোটে, তাই গ্যাস হিসেবে স্তম্ভের চূড়া দিয়ে বের হয়।'
  - q: 'পেট্রোলিয়ামের যে অংশের অণুতে কার্বন সংখ্যা বেশি, তার স্ফুটনাঙ্ক—'
    options: ['বেশি', 'কম', 'সমান', 'নির্দিষ্ট নয়']
    answer: 0
    why: 'বড় অণুর মধ্যে আকর্ষণ বল বেশি, তাই বেশি তাপমাত্রায় ফোটে এবং স্তম্ভের নিচের দিকে জমে।'
  - q: 'পেট্রোলিয়ামের অংশ ও ব্যবহার—'
    statements:
      - 'কেরোসিন: বাতি ও চুলা জ্বালানো এবং জেট বিমানের জ্বালানি'
      - 'পেট্রোল: রাস্তা তৈরির পিচ'
      - 'বিটুমিন: রাস্তা ও ছাদ তৈরিতে'
    answer: 1
    why: 'পেট্রোল গাড়ির জ্বালানি; রাস্তার পিচ হলো বিটুমিন। ii ভুল।'
  - q: 'আংশিক পাতন স্তম্ভে তাপমাত্রা কেমন থাকে?'
    options: ['নিচে বেশি, ওপরে কম', 'ওপরে বেশি, নিচে কম', 'সব জায়গায় সমান', 'মাঝখানে সবচেয়ে বেশি']
    answer: 0
    why: 'গরম বাষ্প নিচ দিয়ে ঢোকে এবং ওপরে উঠতে উঠতে ঠান্ডা হয়; তাই প্রতিটি অংশ তার স্ফুটনাঙ্কের কাছাকাছি স্তরে তরল হয়।'
