# MCQ practice for the simulation "extraction-method": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'অ্যালুমিনিয়াম কোন পদ্ধতিতে নিষ্কাশন করা হয়?'
    options: ['গলিত আকরিকের তড়িৎ বিশ্লেষণে', 'কার্বন দিয়ে বিজারণে', 'বাতাসে তাপ দিয়ে জারণে', 'প্রকৃতিতে মুক্ত অবস্থা থেকে সংগ্রহ করে']
    answer: 0
    why: 'অ্যালুমিনিয়াম কার্বনের চেয়ে বেশি সক্রিয়, তাই কার্বন একে বিজারিত করতে পারে না; গলিত অ্যালুমিনার তড়িৎ বিশ্লেষণ করতে হয়।'
  - q: 'মারুত চুল্লিতে আয়রন অক্সাইডকে লোহায় পরিণত করে কোনটি?'
    options: ['কার্বন মনোক্সাইড (কোক থেকে)', 'হাইড্রোজেন', 'সোডিয়াম', 'ক্লোরিন']
    answer: 0
    why: 'কোক পুড়ে CO তৈরি হয়; CO আয়রন অক্সাইড থেকে অক্সিজেন সরিয়ে লোহা তৈরি করে: Fe₂O₃ + 3CO → 2Fe + 3CO₂।'
  - q: 'লোহার পাত CuSO₄ দ্রবণে ডুবিয়ে রাখলে কী ঘটে?'
    options: ['পাতের গায়ে লালচে কপার জমে', 'কোনো বিক্রিয়া হয় না', 'দ্রবণের নীল রং আরও গাঢ় হয়', 'পাত থেকে হাইড্রোজেন গ্যাস বের হয়']
    answer: 0
    why: 'লোহা কপারের চেয়ে সক্রিয়, তাই দ্রবণ থেকে কপারকে সরিয়ে দেয়: Fe + CuSO₄ → FeSO₄ + Cu।'
  - q: 'সক্রিয়তা সিরিজ সম্পর্কে—'
    statements:
      - 'কপার জিংককে তার লবণের দ্রবণ থেকে সরাতে পারে'
      - 'কার্বনের চেয়ে বেশি সক্রিয় ধাতু তড়িৎ বিশ্লেষণে নিষ্কাশিত হয়'
      - 'সোনা প্রকৃতিতে মুক্ত অবস্থায় পাওয়া যায়'
    answer: 2
    why: 'কপার জিংকের চেয়ে কম সক্রিয়, তাই জিংককে সরাতে পারে না। i ভুল।'
  - q: 'বক্সাইট কোন ধাতুর প্রধান আকরিক?'
    options: ['অ্যালুমিনিয়াম', 'লোহা', 'কপার', 'জিংক']
    answer: 0
    why: 'বক্সাইট হলো আর্দ্র অ্যালুমিনিয়াম অক্সাইড (Al₂O₃·2H₂O); লোহার প্রধান আকরিক হেমাটাইট।'
