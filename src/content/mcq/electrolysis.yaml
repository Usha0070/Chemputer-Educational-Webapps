# MCQ practice for the simulation "electrolysis": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'গলিত NaCl-এর তড়িৎ বিশ্লেষণে ক্যাথোডে কী জমা হয়?'
    options: ['সোডিয়াম ধাতু', 'ক্লোরিন গ্যাস', 'হাইড্রোজেন গ্যাস', 'অক্সিজেন গ্যাস']
    answer: 0
    why: 'গলিত অবস্থায় শুধু Na⁺ ও Cl⁻ থাকে। Na⁺ ক্যাথোড থেকে ইলেকট্রন নিয়ে সোডিয়াম ধাতু হয়; অ্যানোডে Cl₂ বের হয়।'
  - q: 'ব্রাইনের (গাঢ় NaCl দ্রবণ) তড়িৎ বিশ্লেষণে ক্যাথোডে কোন গ্যাস উৎপন্ন হয়?'
    options: ['H₂', 'Cl₂', 'O₂', 'N₂']
    answer: 0
    why: 'দ্রবণে Na⁺-এর চেয়ে পানির H⁺ সহজে ইলেকট্রন নেয়, তাই ক্যাথোডে H₂ বের হয় আর দ্রবণে NaOH থেকে যায়।'
  - q: 'তড়িৎ বিশ্লেষণে অ্যানোডে কোন ধরনের বিক্রিয়া ঘটে?'
    options: ['জারণ', 'বিজারণ', 'প্রশমন', 'অধঃক্ষেপণ']
    answer: 0
    why: 'অ্যানোডে ঋণাত্মক আয়ন ইলেকট্রন ছেড়ে দেয়, অর্থাৎ জারণ ঘটে।'
  - q: 'কপার তড়িৎদ্বার দিয়ে CuSO₄ দ্রবণের তড়িৎ বিশ্লেষণে—'
    statements:
      - 'দ্রবণের নীল রং দ্রুত মুছে যায়'
      - 'ক্যাথোডে কপার জমা হয়'
      - 'অ্যানোডের কপার ক্ষয় হয়ে দ্রবণে যায়'
    answer: 2
    why: 'অ্যানোড থেকে যতটুকু Cu²⁺ দ্রবণে যায়, ক্যাথোডে ততটুকুই জমে; তাই দ্রবণের নীল রং প্রায় একই থাকে। i ভুল।'
  - q: 'তড়িৎ বিশ্লেষণে ধনাত্মক আয়নগুলো কোন তড়িৎদ্বারের দিকে যায়?'
    options: ['ক্যাথোড', 'অ্যানোড', 'দুটির দিকেই', 'কোনোটির দিকেই নয়']
    answer: 0
    why: 'ক্যাথোড ঋণাত্মক, তাই ধনাত্মক আয়ন (ক্যাটায়ন) সেদিকে আকৃষ্ট হয়।'
