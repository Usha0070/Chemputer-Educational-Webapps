# MCQ practice for the simulation "kinetic-theory": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'কোন অবস্থায় কণাগুলোর মধ্যে আকর্ষণ বল সবচেয়ে বেশি?'
    options: ['কঠিন', 'তরল', 'গ্যাস', 'তিন অবস্থায় সমান']
    answer: 0
    why: 'কঠিনে কণাগুলো খুব কাছাকাছি নির্দিষ্ট অবস্থানে থাকে, আকর্ষণ বল সবচেয়ে বেশি; তাই তারা শুধু নিজের জায়গায় কাঁপতে পারে।'
  - q: 'তাপমাত্রা বাড়ালে কণাগুলোর কোনটি বাড়ে?'
    options: ['গড় গতিশক্তি', 'ভর', 'সংখ্যা', 'আকার']
    answer: 0
    why: 'তাপমাত্রা হলো কণাগুলোর গড় গতিশক্তির পরিমাপ। তাপ দিলে কণা দ্রুত চলে, কিন্তু তাদের ভর, সংখ্যা বা আকার বদলায় না।'
  - q: 'পদার্থের অবস্থা সম্পর্কে—'
    statements:
      - 'কঠিনের কণাগুলো একেবারে স্থির থাকে'
      - 'গ্যাসের কণাগুলো সব দিকে এলোমেলোভাবে ছোটে'
      - 'তরলের নির্দিষ্ট আয়তন আছে কিন্তু নির্দিষ্ট আকার নেই'
    answer: 2
    why: 'কঠিনের কণাও নিজের অবস্থানে অবিরাম কাঁপে, একেবারে স্থির থাকে না। তাই শুধু ii ও iii সঠিক।'
  - q: 'আবদ্ধ পাত্রে গ্যাসের চাপ সৃষ্টি হয় কেন?'
    options: ['কণাগুলো পাত্রের দেয়ালে অবিরাম ধাক্কা খায় বলে', 'কণাগুলো একে অপরকে আকর্ষণ করে বলে', 'কণাগুলো পাত্রের তলায় জমে থাকে বলে', 'কণাগুলো স্থির থাকে বলে']
    answer: 0
    why: 'ছুটন্ত গ্যাস কণা প্রতি মুহূর্তে পাত্রের দেয়ালে ধাক্কা খায়; প্রতি একক ক্ষেত্রফলে এই ধাক্কার বলই চাপ।'
  - stem: 'একটি সিরিঞ্জের মুখ আঙুল দিয়ে বন্ধ করে পিস্টন ঠেলে ভেতরের বাতাসের আয়তন অর্ধেক করা হলো। তাপমাত্রা একই রইল।'
    q: 'ভেতরের বাতাসের চাপের কী হবে?'
    options: ['প্রায় দ্বিগুণ হবে', 'অর্ধেক হবে', 'একই থাকবে', 'শূন্য হয়ে যাবে']
    answer: 0
    why: 'একই কণাগুলো এখন অর্ধেক জায়গায়, তাই প্রতি সেকেন্ডে দেয়ালে প্রায় দ্বিগুণ বার ধাক্কা খায়। স্থির তাপমাত্রায় আয়তন অর্ধেক হলে চাপ দ্বিগুণ হয় (বয়েলের সূত্র)।'
