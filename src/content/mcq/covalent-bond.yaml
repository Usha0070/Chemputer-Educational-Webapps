# MCQ practice for the simulation "covalent-bond": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'N₂ অণুতে দুটি নাইট্রোজেন পরমাণুর মধ্যে কোন বন্ধন থাকে?'
    options: ['ত্রিবন্ধন', 'একক বন্ধন', 'দ্বিবন্ধন', 'আয়নিক বন্ধন']
    answer: 0
    why: 'প্রতিটি N-এর ৫টি যোজ্যতা ইলেকট্রন; অষ্টক পূরণে প্রত্যেকে ৩টি ইলেকট্রন ভাগাভাগি করে, তৈরি হয় তিনটি যুগল: N≡N।'
  - q: 'H₂O অণুতে অক্সিজেন পরমাণুর কয়টি মুক্তজোড় (নিঃসঙ্গ যুগল) ইলেকট্রন থাকে?'
    options: ['২', '১', '৩', '০']
    answer: 0
    why: 'O-এর ৬টি যোজ্যতা ইলেকট্রনের ২টি দুটি O–H বন্ধনে যায়, বাকি ৪টি দুটি মুক্তজোড় হিসেবে থাকে।'
  - q: 'CO₂ অণুতে মোট কয়টি ইলেকট্রন যুগল ভাগাভাগি হয়?'
    options: ['৪', '২', '৩', '৬']
    answer: 0
    why: 'O=C=O: দুটি দ্বিবন্ধন, প্রতিটিতে ২টি যুগল, মোট ৪টি ভাগাভাগি করা যুগল।'
  - q: 'CH₄ অণুতে—'
    statements:
      - 'চারটি C–H একক বন্ধন আছে'
      - 'C পরমাণু অষ্টক পূর্ণ করে'
      - 'প্রতিটি H পরমাণু He-এর মতো বিন্যাস পায়'
    answer: 3
    why: 'তিনটিই সঠিক। C চারটি H-এর সাথে একটি করে যুগল ভাগ করে ৮টি ইলেকট্রন পায়, আর প্রতিটি H পায় ২টি, He-এর মতো।'
  - q: 'সমযোজী যৌগ সম্পর্কে কোনটি সাধারণত সত্য?'
    options: ['গলনাঙ্ক ও স্ফুটনাঙ্ক তুলনামূলক কম', 'গলিত অবস্থায় ভালো বিদ্যুৎ পরিবাহী', 'পানিতে দ্রবীভূত হলে সবসময় আয়নে বিয়োজিত হয়', 'সবসময় কঠিন অবস্থায় থাকে']
    answer: 0
    why: 'সমযোজী অণুগুলোর মধ্যের আকর্ষণ দুর্বল, তাই অনেক সমযোজী যৌগ সাধারণ তাপমাত্রায় গ্যাস বা তরল, গলনাঙ্কও কম।'
