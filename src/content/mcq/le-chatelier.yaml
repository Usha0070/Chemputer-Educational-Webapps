# MCQ practice for the simulation "le-chatelier": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'N₂ + 3H₂ ⇌ 2NH₃ সাম্যাবস্থায় চাপ বাড়ালে সাম্যাবস্থা কোন দিকে সরে?'
    options: ['ডানে, NH₃ বাড়ে', 'বামে, NH₃ কমে', 'কোনো দিকে সরে না', 'প্রথমে বামে, পরে ডানে']
    answer: 0
    why: 'বামে ৪ মোল গ্যাস, ডানে ২ মোল। চাপ বাড়লে সাম্যাবস্থা কম মোল গ্যাসের দিকে সরে চাপ কমাতে চায়।'
  - q: 'হেবার প্রণালির (তাপোৎপাদী) সাম্যাবস্থায় তাপমাত্রা বাড়ালে কী হয়?'
    options: ['সাম্যাবস্থা বামে সরে, NH₃ কমে', 'সাম্যাবস্থা ডানে সরে, NH₃ বাড়ে', 'কোনো পরিবর্তন হয় না', 'সব NH₃ ভেঙে N₂ ও H₂ হয়']
    answer: 0
    why: 'সম্মুখ বিক্রিয়া তাপ ছাড়ে। বাড়তি তাপ শোষণ করতে সাম্যাবস্থা তাপহারী দিকে, অর্থাৎ বামে সরে।'
  - q: 'সাম্যাবস্থায় থাকা মিশ্রণে প্রভাবক যোগ করলে কী হয়?'
    options: ['সাম্যাবস্থা দ্রুত অর্জিত হয়, কিন্তু অবস্থান বদলায় না', 'সাম্যাবস্থা ডানে সরে', 'সাম্যাবস্থা বামে সরে', 'উৎপাদের পরিমাণ দ্বিগুণ হয়']
    answer: 0
    why: 'প্রভাবক সম্মুখ ও পশ্চাৎ দুই বিক্রিয়াকেই সমানভাবে দ্রুত করে, তাই সাম্যাবস্থার অবস্থান বদলায় না।'
  - q: '2NO₂ (বাদামি) ⇌ N₂O₄ (বর্ণহীন), সম্মুখ বিক্রিয়া তাপোৎপাদী। এখানে—'
    statements:
      - 'মিশ্রণ ঠান্ডা করলে রং হালকা হয়'
      - 'মিশ্রণ গরম করলে N₂O₄ বাড়ে'
      - 'চাপ বাড়ালে সাম্যাবস্থা ডানে সরে'
    answer: 1
    why: 'গরম করলে সাম্যাবস্থা তাপহারী (পশ্চাৎ) দিকে সরে, ফলে NO₂ বাড়ে, N₂O₄ কমে। তাই ii ভুল।'
  - stem: 'হেবার প্রণালিতে উৎপন্ন NH₃ ক্রমাগত ঠান্ডা করে তরল আকারে সরিয়ে নেওয়া হয়।'
    q: 'এর ফলে কী ঘটে?'
    options: ['সাম্যাবস্থা ডানে সরে, আরও NH₃ তৈরি হয়', 'সাম্যাবস্থা বামে সরে', 'বিক্রিয়া পুরোপুরি থেমে যায়', 'NH₃ ভেঙে N₂ ও H₂ তৈরি হয়']
    answer: 0
    why: 'উৎপাদ সরিয়ে নিলে সেই ঘাটতি পূরণ করতে সাম্যাবস্থা উৎপাদের দিকে সরে।'
