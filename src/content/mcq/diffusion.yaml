# MCQ practice for the simulation "diffusion": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'ব্যাপন কাকে বলে?'
    options: ['কোনো পদার্থের কণার উচ্চ ঘনমাত্রা থেকে নিম্ন ঘনমাত্রার দিকে নিজে নিজে ছড়িয়ে পড়া', 'সরু ছিদ্র দিয়ে গ্যাসের উচ্চ চাপ থেকে নিম্ন চাপের দিকে বেরিয়ে আসা', 'তরলের বাষ্পে পরিণত হওয়া', 'কঠিনের সরাসরি বাষ্পে পরিণত হওয়া']
    answer: 0
    why: 'সরু ছিদ্র দিয়ে বেরিয়ে আসা হলো নিঃসরণ, তরলের বাষ্প হওয়া বাষ্পীভবন, আর কঠিনের সরাসরি বাষ্প হওয়া ঊর্ধ্বপাতন।'
  - q: 'কাচের নলের দুই প্রান্ত থেকে একসাথে NH₃ ও HCl গ্যাস ছাড়লে সাদা ধোঁয়ার বলয় কোথায় তৈরি হয়?'
    options: ['HCl-এর প্রান্তের কাছে', 'NH₃-এর প্রান্তের কাছে', 'ঠিক মাঝখানে', 'কোথাও তৈরি হয় না']
    answer: 0
    why: 'NH₃-এর আণবিক ভর ১৭, HCl-এর ৩৬.৫। হালকা NH₃ দ্রুত ছড়ায় এবং বেশি পথ পেরিয়ে HCl-এর প্রান্তের কাছে গিয়ে মেলে।'
  - q: 'নলের ভেতরের সাদা ধোঁয়াটি কোন যৌগ?'
    options: ['NH₄Cl', 'NaCl', 'NH₃', 'Cl₂']
    answer: 0
    why: 'NH₃ + HCl → NH₄Cl। উৎপন্ন অ্যামোনিয়াম ক্লোরাইডের সূক্ষ্ম কঠিন কণাই সাদা ধোঁয়া হিসেবে দেখা যায়।'
  - q: 'ব্যাপন সম্পর্কে—'
    statements:
      - 'হালকা গ্যাসের ব্যাপন হার বেশি'
      - 'তাপমাত্রা বাড়লে ব্যাপন দ্রুত হয়'
      - 'পানিতে কালির ফোঁটা ছড়িয়ে পড়াও ব্যাপন'
    answer: 3
    why: 'তিনটিই সঠিক। ব্যাপন গ্যাস ও তরল দুটিতেই ঘটে, আর বেশি তাপমাত্রায় কণাগুলো দ্রুত চলে বলে ব্যাপনও দ্রুত হয়।'
  - stem: 'গ্রাহামের ব্যাপন সূত্র অনুযায়ী ব্যাপন হার আণবিক ভরের বর্গমূলের ব্যস্তানুপাতিক। O₂-এর আণবিক ভর ৩২, H₂-এর ২।'
    q: 'একই অবস্থায় H₂ অক্সিজেনের চেয়ে কত গুণ দ্রুত ব্যাপিত হবে?'
    options: ['৪ গুণ', '১৬ গুণ', '২ গুণ', '৮ গুণ']
    answer: 0
    why: 'হারের অনুপাত = √(৩২ ÷ ২) = √১৬ = ৪।'
