# MCQ practice for the simulation "heating-curve": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'বিশুদ্ধ বরফ গলার সময় তাপ দিতে থাকলেও তাপমাত্রা কত থাকে?'
    options: ['০ °সে', '১০০ °সে', '−২০ °সে', '৪ °সে']
    answer: 0
    why: 'বরফ পুরোপুরি না গলা পর্যন্ত বরফ-পানির মিশ্রণের তাপমাত্রা ০ °সে-এ স্থির থাকে।'
  - q: 'গলনের সময় দেওয়া তাপ কোন কাজে খরচ হয়?'
    options: ['কণাগুলোর মধ্যের আকর্ষণ বল ছিন্ন করতে', 'কণাগুলোর গতিশক্তি বাড়াতে', 'পানির ভর বাড়াতে', 'কণাগুলোর আকার বড় করতে']
    answer: 0
    why: 'এই তাপকে গলনের সুপ্ততাপ বলে। এটি কণার গতিশক্তি বাড়ায় না, তাই থার্মোমিটারে তাপমাত্রা বাড়ে না।'
  - q: 'পানির উত্তাপন লেখচিত্রে কোন সমতল অংশটি সবচেয়ে লম্বা?'
    options: ['স্ফুটনের সময়ের অংশ', 'গলনের সময়ের অংশ', 'বরফ গরম হওয়ার অংশ', 'বাষ্প গরম হওয়ার অংশ']
    answer: 0
    why: 'পানির বাষ্পীভবনের সুপ্ততাপ (প্রায় ২২৬০ J/g) গলনের সুপ্ততাপের (প্রায় ৩৩৪ J/g) প্রায় ৭ গুণ, তাই একই বার্নারে স্ফুটন অনেক বেশি সময় নেয়।'
  - q: 'উত্তাপন লেখচিত্র সম্পর্কে—'
    statements:
      - 'স্ফুটনের সময় পানি ও বাষ্প একসাথে থাকে'
      - 'বিশুদ্ধ পানির গলনাঙ্ক ও বরফের হিমাঙ্ক একই তাপমাত্রা'
      - 'বার্নারের তাপ বাড়ালে স্ফুটনাঙ্কও বেড়ে যায়'
    answer: 0
    why: 'বেশি তাপ দিলে সমতল অংশটি ছোট হয়, কিন্তু একই বায়ুচাপে স্ফুটনাঙ্ক ১০০ °সে-ই থাকে। তাই iii ভুল।'
  - stem: '৫০ g বরফকে ০ °সে-এ পুরোপুরি গলাতে হবে। বরফের গলনের সুপ্ততাপ ৩৩৪ J/g।'
    q: 'কত তাপ লাগবে?'
    options: ['১৬৭০০ J', '৩৩৪ J', '৬৬৮০ J', '১১৩০০০ J']
    answer: 0
    why: 'Q = m × L = ৫০ g × ৩৩৪ J/g = ১৬৭০০ J। গলনের সময় তাপমাত্রা বদলায় না, তাই mcΔT লাগে না।'
