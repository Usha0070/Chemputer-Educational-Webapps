# MCQ practice for the simulation "build-an-atom": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'একটি মৌলের পরিচয় কোনটি দিয়ে নির্ধারিত হয়?'
    options: ['প্রোটন সংখ্যা', 'নিউট্রন সংখ্যা', 'ভরসংখ্যা', 'ইলেকট্রন সংখ্যা']
    answer: 0
    why: 'প্রোটন সংখ্যা (পারমাণবিক সংখ্যা) বদলালে মৌলই বদলে যায়। নিউট্রন বদলালে আইসোটোপ, ইলেকট্রন বদলালে আয়ন হয়।'
  - q: 'সোডিয়ামের ভরসংখ্যা ২৩ এবং পারমাণবিক সংখ্যা ১১। এর নিউক্লিয়াসে নিউট্রন কয়টি?'
    options: ['১২', '১১', '২৩', '৩৪']
    answer: 0
    why: 'নিউট্রন = ভরসংখ্যা − পারমাণবিক সংখ্যা = ২৩ − ১১ = ১২।'
  - q: 'Cl⁻ আয়নে (Cl-এর পারমাণবিক সংখ্যা ১৭) ইলেকট্রন কয়টি?'
    options: ['১৮', '১৭', '১৬', '৩৫']
    answer: 0
    why: 'নিরপেক্ষ Cl-এ ১৭টি ইলেকট্রন। একটি ইলেকট্রন গ্রহণ করে Cl⁻ হয়, তাই ১৮টি।'
  - q: '¹²C ও ¹⁴C সম্পর্কে—'
    statements:
      - 'দুটিরই প্রোটন সংখ্যা ৬'
      - 'দুটির রাসায়নিক ধর্ম সম্পূর্ণ ভিন্ন'
      - 'দুটির নিউট্রন সংখ্যা ভিন্ন'
    answer: 1
    why: 'এরা কার্বনের আইসোটোপ: প্রোটন ও ইলেকট্রন সংখ্যা একই, তাই রাসায়নিক ধর্ম প্রায় একই; পার্থক্য শুধু নিউট্রনে (৬ ও ৮)।'
  - stem: 'একটি কণায় ১২টি প্রোটন, ১২টি নিউট্রন ও ১০টি ইলেকট্রন আছে।'
    q: 'কণাটি কোনটি?'
    options: ['Mg²⁺', 'Mg', 'Ne', 'Na⁺']
    answer: 0
    why: '১২টি প্রোটন মানে মৌলটি Mg। ইলেকট্রন প্রোটনের চেয়ে ২টি কম, তাই আধান +২: Mg²⁺।'
