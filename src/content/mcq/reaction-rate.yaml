# MCQ practice for the simulation "reaction-rate": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'তাপমাত্রা বাড়ালে বিক্রিয়ার হার বাড়ে কেন?'
    options: ['বেশি কণা সক্রিয়ণ শক্তির সমান বা বেশি শক্তি নিয়ে ধাক্কা খায়', 'কণাগুলোর ভর বেড়ে যায়', 'বিক্রিয়কের পরিমাণ বেড়ে যায়', 'নতুন প্রভাবক তৈরি হয়']
    answer: 0
    why: 'গরমে কণা দ্রুত চলে, বেশি বার ধাক্কা খায়, আর আরও বেশি ধাক্কা কার্যকর হয় (সক্রিয়ণ শক্তি পেরোয়)।'
  - q: 'প্রভাবক কীভাবে বিক্রিয়ার হার বাড়ায়?'
    options: ['সক্রিয়ণ শক্তি কমিয়ে', 'তাপমাত্রা বাড়িয়ে', 'বিক্রিয়কের ঘনমাত্রা বাড়িয়ে', 'নিজে খরচ হয়ে উৎপাদ বাড়িয়ে']
    answer: 0
    why: 'প্রভাবক কম শক্তির একটি বিকল্প পথ দেয়, ফলে বেশি সংঘর্ষ কার্যকর হয়; বিক্রিয়া শেষে প্রভাবক অপরিবর্তিত থাকে।'
  - q: 'একই ভরের মার্বেলের টুকরো ও মার্বেলের গুঁড়ার মধ্যে কোনটি একই HCl-এর সাথে দ্রুত বিক্রিয়া করে?'
    options: ['গুঁড়া', 'টুকরো', 'দুটিই সমান দ্রুত', 'কোনোটিই বিক্রিয়া করে না']
    answer: 0
    why: 'গুঁড়ার মোট পৃষ্ঠতলের ক্ষেত্রফল অনেক বেশি, তাই একসাথে বেশি কণা এসিডের সংস্পর্শে আসে।'
  - q: 'বিক্রিয়ার হার বাড়ে—'
    statements:
      - 'কঠিন বিক্রিয়কের টুকরো আরও বড় করলে'
      - 'বিক্রিয়কের ঘনমাত্রা বাড়ালে'
      - 'তাপমাত্রা বাড়ালে'
    answer: 2
    why: 'টুকরো বড় করলে পৃষ্ঠতল কমে, হারও কমে। তাই i ভুল।'
  - stem: 'একটি বিক্রিয়ায় সময়ের সাথে উৎপাদের পরিমাণের লেখচিত্র আঁকা হলো। শুরুতে রেখাটি খাড়া, পরে ধীরে ধীরে সমতল হয়ে যায়।'
    q: 'রেখাটি শেষে সমতল হয়ে যায় কেন?'
    options: ['বিক্রিয়ক ফুরিয়ে আসে বলে', 'প্রভাবক খরচ হয়ে যায় বলে', 'উৎপাদ আবার বিক্রিয়ক হয়ে যায় বলে', 'তাপমাত্রা হঠাৎ শূন্যে নেমে যায় বলে']
    answer: 0
    why: 'বিক্রিয়কের ঘনমাত্রা কমতে থাকায় হার কমে, আর বিক্রিয়ক শেষ হলে আর উৎপাদ তৈরি হয় না, রেখা সমতল হয়।'
