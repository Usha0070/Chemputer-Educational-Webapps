# MCQ practice for the simulation "group-by-block": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 's-ব্লকের মৌলের গ্রুপ নম্বর কীভাবে বের করা হয়?'
    options: ['যোজ্যতা স্তরের s ইলেকট্রনের সংখ্যা', '১০ + যোজ্যতা স্তরের s ও p ইলেকট্রনের যোগফল', '(n−1)d ও ns ইলেকট্রনের যোগফল', 'মোট ইলেকট্রন সংখ্যা']
    answer: 0
    why: 's-ব্লকে গ্রুপ = ns ইলেকট্রনের সংখ্যা (১ বা ২)। যেমন Na: 3s¹ → গ্রুপ ১।'
  - q: 'p-ব্লকের মৌলের গ্রুপ নম্বর কোনটি?'
    options: ['১০ + যোজ্যতা স্তরের s ও p ইলেকট্রনের যোগফল', 'শুধু যোজ্যতা স্তরের p ইলেকট্রনের সংখ্যা', '৮ − p ইলেকট্রনের সংখ্যা', '(n−1)d ইলেকট্রনের সংখ্যা']
    answer: 0
    why: 'যেমন Cl: 3s² 3p⁵ → ১০ + ২ + ৫ = ১৭।'
  - q: 'Mn (পারমাণবিক সংখ্যা ২৫): [Ar] 3d⁵ 4s²। এর গ্রুপ নম্বর কত?'
    options: ['৭', '৫', '২', '১৭']
    answer: 0
    why: 'd-ব্লকে গ্রুপ = (n−1)d ইলেকট্রন + ns ইলেকট্রন = ৫ + ২ = ৭।'
  - q: 'হিলিয়াম (1s²) সম্পর্কে—'
    statements:
      - 'এর শেষ ইলেকট্রন s অরবিটালে প্রবেশ করে'
      - 'ধর্মের মিলের কারণে একে গ্রুপ ১৮-এ রাখা হয়'
      - 'এর যোজ্যতা স্তর ইলেকট্রনে পূর্ণ'
    answer: 3
    why: 'তিনটিই সঠিক। বিন্যাস অনুযায়ী He-এর শেষ ইলেকট্রন 1s-এ, কিন্তু পূর্ণ স্তর ও নিষ্ক্রিয়তার জন্য একে নিষ্ক্রিয় গ্যাসের সাথে গ্রুপ ১৮-এ রাখা হয়।'
  - q: 'Zn (পারমাণবিক সংখ্যা ৩০): [Ar] 3d¹⁰ 4s²। এর গ্রুপ নম্বর কত?'
    options: ['১২', '১০', '২', '১৮']
    answer: 0
    why: 'd-ব্লকের নিয়মে গ্রুপ = ১০ + ২ = ১২।'
