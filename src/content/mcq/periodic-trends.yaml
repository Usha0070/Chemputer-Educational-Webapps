# MCQ practice for the simulation "periodic-trends": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'একই পর্যায়ে বাম থেকে ডানে গেলে পরমাণুর আকারের কী হয়?'
    options: ['কমে', 'বাড়ে', 'একই থাকে', 'আগে বাড়ে, পরে কমে']
    answer: 0
    why: 'প্রোটন সংখ্যা বাড়ায় নিউক্লিয়াসের আকর্ষণ বাড়ে, অথচ ইলেকট্রন একই শক্তিস্তরে যোগ হয়; তাই ইলেকট্রন মেঘ সংকুচিত হয়।'
  - q: 'নিচের কোন মৌলের তড়িৎ ঋণাত্মকতা সবচেয়ে বেশি?'
    options: ['F', 'O', 'Cl', 'N']
    answer: 0
    why: 'ফ্লোরিন পর্যায় সারণির ডান-ওপরে, ছোট আকার ও উচ্চ কার্যকর নিউক্লিয়ার আধানের কারণে এর তড়িৎ ঋণাত্মকতা সবচেয়ে বেশি।'
  - q: 'একই গ্রুপে ওপর থেকে নিচে নামলে আয়নীকরণ শক্তির কী হয়?'
    options: ['কমে', 'বাড়ে', 'একই থাকে', 'শূন্য হয়ে যায়']
    answer: 0
    why: 'নিচে নামলে নতুন শক্তিস্তর যোগ হয়, শেষ ইলেকট্রন নিউক্লিয়াস থেকে দূরে থাকে; তাকে সরাতে কম শক্তি লাগে।'
  - q: 'একই পর্যায়ে বাম থেকে ডানে গেলে—'
    statements:
      - 'তড়িৎ ঋণাত্মকতা কমে'
      - 'ধাতব ধর্ম কমে'
      - 'আয়নীকরণ শক্তি সাধারণত বাড়ে'
    answer: 2
    why: 'ডানে গেলে তড়িৎ ঋণাত্মকতা বাড়ে, কমে না। তাই i ভুল।'
  - q: 'Na, Mg, Al ও Si-এর মধ্যে কোনটির পরমাণুর আকার সবচেয়ে বড়?'
    options: ['Na', 'Mg', 'Al', 'Si']
    answer: 0
    why: 'চারটিই পর্যায় ৩-এ। বাম থেকে ডানে আকার কমে, তাই সবচেয়ে বামের Na সবচেয়ে বড়।'
