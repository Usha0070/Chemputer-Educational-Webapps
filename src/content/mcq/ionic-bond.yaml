# MCQ practice for the simulation "ionic-bond": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'আয়নিক বন্ধন গঠনের সময় কী ঘটে?'
    options: ['ধাতু থেকে অধাতুতে ইলেকট্রন স্থানান্তরিত হয়', 'দুটি অধাতু ইলেকট্রন ভাগাভাগি করে', 'প্রোটন স্থানান্তরিত হয়', 'নিউট্রন ভাগাভাগি হয়']
    answer: 0
    why: 'ধাতু ইলেকট্রন ছেড়ে ধনাত্মক আয়ন, অধাতু ইলেকট্রন নিয়ে ঋণাত্মক আয়ন হয়; বিপরীত আধানের আকর্ষণই আয়নিক বন্ধন।'
  - q: 'MgO গঠনে প্রতিটি Mg পরমাণু কয়টি ইলেকট্রন ত্যাগ করে?'
    options: ['২', '১', '৩', '৬']
    answer: 0
    why: 'Mg: 2, 8, 2। শেষ স্তরের ২টি ইলেকট্রন O পরমাণুকে দিয়ে Mg²⁺ হয়, আর O হয় O²⁻।'
  - q: 'Na⁺ আয়নের ইলেকট্রন বিন্যাস কোন নিষ্ক্রিয় গ্যাসের মতো?'
    options: ['Ne', 'Ar', 'He', 'Kr']
    answer: 0
    why: 'Na: 2, 8, 1। একটি ইলেকট্রন ছেড়ে Na⁺: 2, 8, যা Ne-এর বিন্যাস।'
  - q: 'আয়নিক যৌগ—'
    statements:
      - 'সাধারণত উচ্চ গলনাঙ্কবিশিষ্ট কঠিন পদার্থ'
      - 'গলিত অবস্থায় বা জলীয় দ্রবণে বিদ্যুৎ পরিবহন করে'
      - 'কঠিন অবস্থায়ও বিদ্যুৎ পরিবহন করে'
    answer: 0
    why: 'কঠিন অবস্থায় আয়নগুলো কেলাসে আটকে থাকে, চলতে পারে না, তাই বিদ্যুৎ পরিবহন করে না। iii ভুল।'
  - stem: 'A মৌলের পারমাণবিক সংখ্যা ২০ এবং B মৌলের পারমাণবিক সংখ্যা ১৭।'
    q: 'A ও B যুক্ত হয়ে কোন সংকেতের যৌগ গঠন করে?'
    options: ['AB₂', 'A₂B', 'AB', 'A₂B₃']
    answer: 0
    why: 'A = Ca (২টি ইলেকট্রন ছাড়ে), B = Cl (১টি ইলেকট্রন নেয়)। তাই একটি Ca-এর সাথে দুটি Cl: CaCl₂ বা AB₂।'
