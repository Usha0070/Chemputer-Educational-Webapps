# MCQ practice for the simulation "organic-conversions": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'ইথিনের সাথে পানি যোগ করে (প্রভাবক H₃PO₄, উচ্চ তাপ ও চাপে) কী পাওয়া যায়?'
    options: ['ইথানল', 'ইথানয়িক এসিড', 'ইথেন', 'পলিথিন']
    answer: 0
    why: 'দ্বিবন্ধনে H ও OH যুক্ত হয়: CH₂=CH₂ + H₂O → CH₃CH₂OH (ইথানল)।'
  - q: 'ইথানলকে জারিত করলে কোন এসিড পাওয়া যায়?'
    options: ['ইথানয়িক এসিড', 'মিথানয়িক এসিড', 'সালফিউরিক এসিড', 'কার্বনিক এসিড']
    answer: 0
    why: 'অম্লীয় KMnO₄ বা K₂Cr₂O₇ দিয়ে জারণে ইথানল থেকে ইথানয়িক (অ্যাসিটিক) এসিড তৈরি হয়; ভিনেগারে এটিই থাকে।'
  - q: 'অনেকগুলো ইথিন অণু একসাথে যুক্ত হয়ে কী তৈরি হয়?'
    options: ['পলিথিন', 'ইথানল', 'এস্টার', 'প্রোটিন']
    answer: 0
    why: 'দ্বিবন্ধন খুলে হাজার হাজার ইথিন অণু শিকলের মতো যুক্ত হয়; একে সংযোজন পলিমারকরণ বলে।'
  - q: 'গাঢ় H₂SO₄-এর উপস্থিতিতে ইথানয়িক এসিড ও ইথানলের বিক্রিয়ায়—'
    statements:
      - 'এস্টার তৈরি হয়'
      - 'পানি উৎপন্ন হয়'
      - 'বিক্রিয়াটিকে এস্টারীকরণ বলে'
    answer: 3
    why: 'তিনটিই সঠিক: CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O। উৎপন্ন ইথাইল ইথানোয়েটের ফলের মতো গন্ধ।'
  - q: 'ইথানলের কার্যকরী মূলক কোনটি?'
    options: ['–OH', '–COOH', '–CHO', 'C=C']
    answer: 0
    why: 'অ্যালকোহলের কার্যকরী মূলক হাইড্রক্সিল (–OH)। –COOH কার্বক্সিলিক এসিডের, –CHO অ্যালডিহাইডের।'
