# MCQ practice for the simulation "rutherford-scattering": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'রাদারফোর্ডের আলফা কণা বিক্ষেপণ পরীক্ষায় কোন ধাতুর পাতলা পাত ব্যবহার করা হয়েছিল?'
    options: ['সোনা', 'রুপা', 'তামা', 'অ্যালুমিনিয়াম']
    answer: 0
    why: 'সোনাকে খুব পাতলা (কয়েকশ পরমাণু পুরু) পাতে পিটিয়ে নেওয়া যায়, তাই রাদারফোর্ড সোনার পাত ব্যবহার করেছিলেন।'
  - q: 'বেশিরভাগ আলফা কণা পাত ভেদ করে সোজা চলে গেল। এ থেকে কী বোঝা যায়?'
    options: ['পরমাণুর বেশিরভাগ জায়গা ফাঁকা', 'নিউক্লিয়াস ঋণাত্মক আধানযুক্ত', 'ইলেকট্রন খুব ভারী', 'পরমাণু একটি নিরেট গোলক']
    answer: 0
    why: 'কণাগুলো কোনো বাধা পায়নি, অর্থাৎ পরমাণুর প্রায় পুরো আয়তনই ফাঁকা।'
  - q: 'খুব অল্প কয়েকটি আলফা কণা প্রায় উল্টো দিকে ফিরে এলো কেন?'
    options: ['পরমাণুর কেন্দ্রে খুব ছোট, ভারী, ধনাত্মক নিউক্লিয়াস আছে', 'ইলেকট্রনগুলো আলফা কণাকে আকর্ষণ করে', 'সোনার পাতটি খুব পুরু ছিল', 'আলফা কণা ঋণাত্মক আধানযুক্ত']
    answer: 0
    why: 'ভারী ধনাত্মক আলফা কণাকে ফিরিয়ে দিতে পারে কেবল খুব ছোট জায়গায় কেন্দ্রীভূত, ভারী, ধনাত্মক কিছু: নিউক্লিয়াস।'
  - q: 'আলফা কণা সম্পর্কে—'
    statements:
      - 'এর ভর ইলেকট্রনের ভরের সমান'
      - 'এটি ধনাত্মক আধানযুক্ত'
      - 'এটি আসলে হিলিয়াম নিউক্লিয়াস'
    answer: 2
    why: 'আলফা কণা হলো He²⁺ (২টি প্রোটন + ২টি নিউট্রন), ইলেকট্রনের চেয়ে প্রায় ৭০০০ গুণ ভারী। তাই i ভুল।'
  - q: 'রাদারফোর্ডের পরমাণু মডেলের একটি সীমাবদ্ধতা কোনটি?'
    options: ['ঘূর্ণায়মান ইলেকট্রন শক্তি হারিয়ে নিউক্লিয়াসে পড়ে যাওয়ার কথা, যা ব্যাখ্যা করা যায় না', 'নিউক্লিয়াসের অস্তিত্ব ব্যাখ্যা করতে পারে না', 'আলফা কণার বিক্ষেপণ ব্যাখ্যা করতে পারে না', 'পরমাণুর ফাঁকা জায়গা ব্যাখ্যা করতে পারে না']
    answer: 0
    why: 'চিরায়ত তত্ত্বে ঘূর্ণায়মান আধান শক্তি বিকিরণ করে; তাহলে ইলেকট্রন সর্পিল পথে নিউক্লিয়াসে পড়ত। পরমাণুর স্থায়িত্ব এই মডেল ব্যাখ্যা করতে পারে না।'
