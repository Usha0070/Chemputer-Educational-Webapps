# MCQ practice for the simulation "ph-scale": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: '২৫ °সে-এ নিরপেক্ষ দ্রবণের pH কত?'
    options: ['৭', '০', '১৪', '১']
    answer: 0
    why: 'বিশুদ্ধ পানিতে H⁺ ও OH⁻ সমান; ২৫ °সে-এ তখন pH = ৭। ৭-এর কম অম্লীয়, বেশি ক্ষারীয়।'
  - q: 'ফেনলফথ্যালিন ক্ষারীয় দ্রবণে কোন রং দেখায়?'
    options: ['গোলাপি', 'বর্ণহীন', 'হলুদ', 'নীল']
    answer: 0
    why: 'ফেনলফথ্যালিন অম্লীয় ও নিরপেক্ষ দ্রবণে বর্ণহীন, ক্ষারীয় দ্রবণে গোলাপি।'
  - q: 'লেবুর রসের pH কোনটির কাছাকাছি?'
    options: ['২', '৭', '১০', '১৩']
    answer: 0
    why: 'লেবুর রসে সাইট্রিক এসিড আছে; এর pH প্রায় ২, অর্থাৎ বেশ অম্লীয়।'
  - q: 'pH সম্পর্কে—'
    statements:
      - 'pH যত কম, দ্রবণ তত বেশি অম্লীয়'
      - 'pH ১ কমলে H⁺ আয়নের ঘনমাত্রা ১০ গুণ বাড়ে'
      - 'এসিড পানি দিয়ে পাতলা করলে pH বাড়ে'
    answer: 3
    why: 'তিনটিই সঠিক। pH লগারিদমিক স্কেল; পাতলা করলে H⁺-এর ঘনমাত্রা কমে, তাই pH ৭-এর দিকে বাড়ে।'
  - q: 'মিথাইল অরেঞ্জ অম্লীয় দ্রবণে কোন রং দেখায়?'
    options: ['লাল', 'হলুদ', 'গোলাপি', 'নীল']
    answer: 0
    why: 'মিথাইল অরেঞ্জ অম্লীয় দ্রবণে লাল, ক্ষারীয় দ্রবণে হলুদ।'
