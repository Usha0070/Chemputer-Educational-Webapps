# MCQ practice for the simulation "periodic-table": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'আধুনিক পর্যায় সারণিতে কয়টি গ্রুপ ও কয়টি পর্যায় আছে?'
    options: ['১৮টি গ্রুপ ও ৭টি পর্যায়', '৮টি গ্রুপ ও ৭টি পর্যায়', '১৮টি গ্রুপ ও ৯টি পর্যায়', '৭টি গ্রুপ ও ১৮টি পর্যায়']
    answer: 0
    why: 'খাড়া কলাম ১৮টি (গ্রুপ), আড়াআড়ি সারি ৭টি (পর্যায়)। ল্যান্থানাইড-অ্যাকটিনাইড আলাদা সারিতে দেখানো হলেও তারা পর্যায় ৬ ও ৭-এর অংশ।'
  - q: 'আধুনিক পর্যায় সারণিতে মৌলগুলো কিসের ক্রমানুসারে সাজানো?'
    options: ['পারমাণবিক সংখ্যা', 'পারমাণবিক ভর', 'নিউট্রন সংখ্যা', 'আবিষ্কারের সাল']
    answer: 0
    why: 'মোজলের কাজের পর থেকে মৌলগুলো পারমাণবিক সংখ্যার ক্রমে সাজানো হয়; মেন্ডেলিফ সাজিয়েছিলেন পারমাণবিক ভর অনুসারে।'
  - q: 'গ্রুপ ১৭-এর মৌলগুলোকে কী বলা হয়?'
    options: ['হ্যালোজেন', 'ক্ষার ধাতু', 'মৃৎক্ষার ধাতু', 'নিষ্ক্রিয় গ্যাস']
    answer: 0
    why: 'F, Cl, Br, I হ্যালোজেন, অর্থাৎ “লবণ উৎপাদক”; ধাতুর সাথে যুক্ত হয়ে লবণ তৈরি করে।'
  - q: 'গ্রুপ ১৮-এর মৌল সম্পর্কে—'
    statements:
      - 'সাধারণ অবস্থায় এরা গ্যাস'
      - 'এরা সহজে আয়নিক যৌগ গঠন করে'
      - 'এদের যোজ্যতা স্তর ইলেকট্রনে পূর্ণ'
    answer: 1
    why: 'যোজ্যতা স্তর পূর্ণ বলে নিষ্ক্রিয় গ্যাসগুলো সহজে কোনো বন্ধন গঠন করে না। তাই ii ভুল।'
  - q: 'নিচের কোনটি d-ব্লকের মৌল?'
    options: ['Fe', 'Na', 'Cl', 'Ca']
    answer: 0
    why: 'Fe-এর শেষ ইলেকট্রন 3d-তে প্রবেশ করে। Na ও Ca s-ব্লক, Cl p-ব্লকের মৌল।'
