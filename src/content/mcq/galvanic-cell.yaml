# MCQ practice for the simulation "galvanic-cell": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'Zn–Cu গ্যালভানিক কোষে অ্যানোড কোনটি?'
    options: ['Zn তড়িৎদ্বার', 'Cu তড়িৎদ্বার', 'লবণ সেতু', 'ভোল্টমিটার']
    answer: 0
    why: 'জিংক কপারের চেয়ে সক্রিয়, সহজে ইলেকট্রন ছাড়ে (জারিত হয়); জারণ যেখানে ঘটে সেটাই অ্যানোড।'
  - q: 'বাইরের তারে ইলেকট্রন কোন দিকে প্রবাহিত হয়?'
    options: ['Zn থেকে Cu-এর দিকে', 'Cu থেকে Zn-এর দিকে', 'লবণ সেতুর ভেতর দিয়ে', 'কোনো দিকেই নয়']
    answer: 0
    why: 'Zn পরমাণু ইলেকট্রন ছেড়ে Zn²⁺ হয়; সেই ইলেকট্রন তার দিয়ে Cu তড়িৎদ্বারে গিয়ে Cu²⁺-কে Cu বানায়।'
  - q: 'লবণ সেতুর কাজ কী?'
    options: ['দুই দ্রবণে আধানের ভারসাম্য রেখে বর্তনী সম্পূর্ণ করা', 'ইলেকট্রন পরিবহন করা', 'তড়িৎদ্বার ঠান্ডা রাখা', 'দুই দ্রবণকে মিশিয়ে দেওয়া']
    answer: 0
    why: 'লবণ সেতুর আয়নগুলো দুই পাত্রে চলে গিয়ে আধানের ভারসাম্য রাখে; ইলেকট্রন চলে শুধু বাইরের তার দিয়ে।'
  - q: 'গ্যালভানিক কোষে—'
    statements:
      - 'রাসায়নিক শক্তি বিদ্যুৎ শক্তিতে রূপান্তরিত হয়'
      - 'কাজ করার জন্য বাইরের বিদ্যুৎ উৎস লাগে'
      - 'অ্যানোডে জারণ ঘটে'
    answer: 1
    why: 'গ্যালভানিক কোষ নিজেই বিদ্যুৎ তৈরি করে; বাইরের উৎস লাগে তড়িৎ বিশ্লেষণ কোষে। ii ভুল।'
  - stem: 'একটি কোষে Mg ও Cu তড়িৎদ্বার, আরেকটি কোষে Zn ও Cu তড়িৎদ্বার ব্যবহার করা হলো (উপযুক্ত লবণের দ্রবণসহ)।'
    q: 'কোন কোষের ভোল্টেজ বেশি হবে?'
    options: ['Mg–Cu কোষের', 'Zn–Cu কোষের', 'দুটির সমান', 'কোনোটিতেই ভোল্টেজ তৈরি হবে না']
    answer: 0
    why: 'সক্রিয়তা সিরিজে Mg ও Cu-এর দূরত্ব Zn ও Cu-এর চেয়ে বেশি; দুই ধাতুর সক্রিয়তার পার্থক্য যত বেশি, ভোল্টেজ তত বেশি।'
