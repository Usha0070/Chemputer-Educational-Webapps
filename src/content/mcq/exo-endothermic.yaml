# MCQ practice for the simulation "exo-endothermic": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'তাপোৎপাদী বিক্রিয়ায় ΔH-এর চিহ্ন কী?'
    options: ['ঋণাত্মক', 'ধনাত্মক', 'শূন্য', 'চিহ্নহীন']
    answer: 0
    why: 'তাপোৎপাদী বিক্রিয়ায় সিস্টেম তাপ ছেড়ে দেয়, উৎপাদের শক্তি বিক্রিয়কের চেয়ে কম, তাই ΔH ঋণাত্মক।'
  - q: 'পানিতে NH₄Cl দ্রবীভূত করলে বিকারটি ঠান্ডা লাগে। প্রক্রিয়াটি কী ধরনের?'
    options: ['তাপহারী', 'তাপোৎপাদী', 'তাপ-নিরপেক্ষ', 'দহন']
    answer: 0
    why: 'দ্রবীভবনের সময় চারপাশ থেকে তাপ শোষিত হয়, তাই পানি ও বিকার ঠান্ডা হয়।'
  - q: 'রাসায়নিক বন্ধন ভাঙার সময় শক্তি—'
    options: ['শোষিত হয়', 'নির্গত হয়', 'লাগে না', 'সবসময় আলো হিসেবে বের হয়']
    answer: 0
    why: 'বন্ধন ভাঙতে শক্তি দিতে হয়; নতুন বন্ধন গঠনে শক্তি বের হয়। দুইয়ের পার্থক্যই বিক্রিয়া তাপ।'
  - q: 'তাপোৎপাদী বিক্রিয়ার উদাহরণ—'
    statements:
      - 'মিথেনের দহন'
      - 'HCl ও NaOH-এর প্রশমন'
      - 'CaCO₃-এর তাপীয় বিয়োজন'
    answer: 0
    why: 'চুনাপাথর ভাঙতে অবিরাম তাপ দিতে হয়, তাই CaCO₃-এর বিয়োজন তাপহারী। iii ভুল।'
  - stem: '১০০ g পানিতে একটি লবণ দ্রবীভূত করায় তাপমাত্রা ৫ °সে বেড়ে গেল। পানির আপেক্ষিক তাপ ৪.২ J g⁻¹ °সে⁻¹।'
    q: 'q = mcΔT সূত্রে নির্গত তাপ কত?'
    options: ['২১০০ J', '৪২০ J', '২১০ J', '৫০০ J']
    answer: 0
    why: 'q = ১০০ × ৪.২ × ৫ = ২১০০ J। তাপমাত্রা বেড়েছে, তাই প্রক্রিয়াটি তাপোৎপাদী।'
