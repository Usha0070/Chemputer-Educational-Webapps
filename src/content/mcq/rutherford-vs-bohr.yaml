# MCQ practice for the simulation "rutherford-vs-bohr": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'বোর মডেল অনুযায়ী ইলেকট্রন কোনো নির্দিষ্ট শক্তিস্তরে ঘুরতে থাকলে—'
    options: ['শক্তি শোষণ বা বিকিরণ করে না', 'অবিরাম শক্তি বিকিরণ করে', 'ধীরে ধীরে নিউক্লিয়াসে পড়ে যায়', 'প্রোটনে পরিণত হয়']
    answer: 0
    why: 'বোরের মতে নির্দিষ্ট (অনুমোদিত) কক্ষপথে ইলেকট্রনের শক্তি স্থির থাকে; স্তর বদলালেই কেবল শক্তি শোষণ বা বিকিরণ হয়।'
  - q: 'ইলেকট্রন উচ্চ শক্তিস্তর থেকে নিম্ন শক্তিস্তরে নামলে কী ঘটে?'
    options: ['নির্দিষ্ট শক্তির আলো বিকিরিত হয়', 'শক্তি শোষিত হয়', 'নিউক্লিয়াস ভেঙে যায়', 'পরমাণুটি আয়নে পরিণত হয়']
    answer: 0
    why: 'বাড়তি শক্তি আলোর ফোটন হিসেবে বেরিয়ে যায়; ফোটনের শক্তি দুই স্তরের শক্তির পার্থক্যের সমান।'
  - q: 'বিকিরিত আলোর শক্তি কোনটির সমান?'
    options: ['দুই শক্তিস্তরের শক্তির পার্থক্য', 'উচ্চতর স্তরের মোট শক্তি', 'নিউক্লিয়াসের শক্তি', 'ইলেকট্রনের গতিশক্তির দ্বিগুণ']
    answer: 0
    why: 'ΔE = E(উচ্চ) − E(নিম্ন) = hν। পার্থক্য নির্দিষ্ট বলেই নির্দিষ্ট রঙের রেখা দেখা যায়।'
  - q: 'বোর পরমাণু মডেল—'
    statements:
      - 'হাইড্রোজেনের রেখা বর্ণালি ব্যাখ্যা করতে পারে'
      - 'ইলেকট্রনের শক্তিকে কয়েকটি নির্দিষ্ট মানে সীমাবদ্ধ ধরে'
      - 'বহু-ইলেকট্রন পরমাণুর বর্ণালিও নিখুঁতভাবে ব্যাখ্যা করে'
    answer: 0
    why: 'বোর মডেল একটি ইলেকট্রনের হাইড্রোজেনের জন্য সফল, কিন্তু বহু-ইলেকট্রন পরমাণুর বর্ণালি নিখুঁতভাবে ব্যাখ্যা করতে পারে না। তাই iii ভুল।'
  - stem: 'হাইড্রোজেন পরমাণুর একটি ইলেকট্রন n = ৩ থেকে n = ২ স্তরে নেমে লাল আলো দিল। আরেকটি ইলেকট্রন n = ৪ থেকে n = ২ স্তরে নামল।'
    q: 'দ্বিতীয় ক্ষেত্রে বিকিরিত আলোর শক্তি প্রথমটির তুলনায়—'
    options: ['বেশি', 'কম', 'সমান', 'শূন্য']
    answer: 0
    why: 'n = ৪ ও n = ২-এর শক্তির পার্থক্য n = ৩ ও n = ২-এর চেয়ে বেশি, তাই বেশি শক্তির (নীলচে-সবুজ) আলো বের হয়।'
