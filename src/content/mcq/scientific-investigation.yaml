# MCQ practice for the simulation "scientific-investigation": board-style questions, original wording. Write the right option anywhere:
# ordinary questions are shuffled at build time (stably); statement questions keep the i/ii/iii option order.
questions:
  - q: 'বৈজ্ঞানিক অনুসন্ধানের ধাপগুলোর সঠিক ক্রম কোনটি?'
    options: ['প্রশ্ন → অনুমান → পরীক্ষা ও পর্যবেক্ষণ → সিদ্ধান্ত', 'অনুমান → সিদ্ধান্ত → প্রশ্ন → পরীক্ষা', 'পরীক্ষা → প্রশ্ন → অনুমান → সিদ্ধান্ত', 'সিদ্ধান্ত → পরীক্ষা → অনুমান → প্রশ্ন']
    answer: 0
    why: 'প্রথমে একটি প্রশ্ন, তারপর তার সম্ভাব্য উত্তর (অনুমান), তারপর পরীক্ষা করে তথ্য সংগ্রহ, শেষে তথ্য দেখে সিদ্ধান্ত।'
  - q: 'চিনি গলার পরীক্ষায় পানির তাপমাত্রা ইচ্ছে করে বদলানো হলো। তাপমাত্রা কোন ধরনের চলক?'
    options: ['স্বাধীন চলক', 'নির্ভরশীল চলক', 'নিয়ন্ত্রিত চলক', 'ধ্রুবক']
    answer: 0
    why: 'যে চলক পরীক্ষক নিজে বদলান তা স্বাধীন চলক; তার ফলে যা বদলায় (গলার সময়) তা নির্ভরশীল চলক।'
  - q: 'একটি পরীক্ষাকে কখন ন্যায্য পরীক্ষা বলা যায়?'
    options: ['যখন একবারে শুধু একটি চলক বদলানো হয় এবং বাকি সব একই রাখা হয়', 'যখন সব চলক একসাথে বদলানো হয়', 'যখন অনুমান সঠিক প্রমাণিত হয়', 'যখন মাত্র একবার পরিমাপ করা হয়']
    answer: 0
    why: 'বাকি সব একই থাকলে তবেই বলা যায় ফলাফলের পরিবর্তন ওই একটি চলকের জন্যই হয়েছে।'
  - q: 'চিনি গলার পরীক্ষায় নিয়ন্ত্রিত চলক—'
    statements:
      - 'চিনির পরিমাণ'
      - 'চিনি গলতে লাগা সময়'
      - 'পানির পরিমাণ'
    answer: 1
    why: 'গলার সময় হলো মাপা হচ্ছে এমন নির্ভরশীল চলক; চিনি ও পানির পরিমাণ একই রাখতে হয়, তাই i ও iii নিয়ন্ত্রিত চলক।'
  - stem: 'রিয়া ২০ °সে-এ নাড়িয়ে আর ৬০ °সে-এ না নাড়িয়ে চিনি গলাল। ৬০ °সে-এর পানিতে চিনি বেশি সময় নিল।'
    q: 'রিয়ার পরীক্ষা সম্পর্কে কোনটি ঠিক?'
    options: ['পরীক্ষাটি ন্যায্য নয়, কারণ তাপমাত্রা আর নাড়ানো দুটোই বদলেছে', 'এতে প্রমাণ হলো গরম পানিতে চিনি ধীরে গলে', 'পরীক্ষাটি ন্যায্য, কারণ দুবার মাপা হয়েছে', 'নাড়ানোর সাথে গলার কোনো সম্পর্ক নেই']
    answer: 0
    why: 'দুটি চলক একসাথে বদলানোয় বলা যায় না বেশি সময় লাগল কোনটির জন্য; নাড়ানো বন্ধ করাতেই গলা অনেক ধীর হয়েছে।'
